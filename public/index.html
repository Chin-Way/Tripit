<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TripIt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TripIt">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<script>/* set theme before paint to avoid a flash */try{var _t=localStorage.getItem('tripit.theme')||'system';var _e=_t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):_t;document.documentElement.setAttribute('data-theme',_e);}catch(_){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#06121f;--bg1:#0a1a2f;--card:#13294a;--card2:#0f2440;
    --line:rgba(150,178,210,.14);--line2:rgba(150,178,210,.26);
    --ink:#eaf2fb;--muted:#90a6c0;--muted2:#5f7790;
    --teal:#37d6e0;--teal2:#1fb6c8;--blue:#4aa3f0;--amber:#eb964c;--green:#34c77b;--purple:#9d7eea;--gold:#ffc23d;
    --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  }
  /* ---- warm light theme (toggle in Profile; defaults to system) ---- */
  :root[data-theme="light"]{
    --bg0:#fdf6ee;--bg1:#fbe8d6;--card:#ffffff;--card2:#fff7ee;
    --line:rgba(92,68,46,.16);--line2:rgba(92,68,46,.28);
    --ink:#2b2521;--muted:#6f635a;--muted2:#9b8c80;
    --teal:#0c8b98;--teal2:#0a7480;--blue:#2f7fce;--amber:#c0702c;--green:#1f9c5c;--purple:#7355c4;--gold:#e0930f;
  }
  [data-theme="light"] body{
    background:radial-gradient(900px 600px at 85% -10%,rgba(255,176,112,.20),transparent 60%),
               radial-gradient(800px 560px at 5% 110%,rgba(255,150,180,.14),transparent 60%),
               linear-gradient(170deg,var(--bg1),var(--bg0));}
  [data-theme="light"] #app{background:linear-gradient(180deg,#fffaf4,#fdf2e7)}
  [data-theme="light"] #device{background:linear-gradient(160deg,#f0d6bd,#e4c4a8)}
  [data-theme="light"] #tabbar{background:rgba(255,250,244,.9)}
  [data-theme="light"] #splash{background:radial-gradient(700px 500px at 50% 30%,rgba(255,176,112,.22),transparent 60%),linear-gradient(180deg,#fffaf4,#fdf2e7)}
  [data-theme="light"] .sp-name,[data-theme="light"] .abtitle,[data-theme="light"] .ph-title,[data-theme="light"] .sv-q{color:#241f1b}
  [data-theme="light"] .statusbar{color:#5a4a3a}
  [data-theme="light"] .statusbar svg{fill:#5a4a3a;stroke:#5a4a3a}
  /* lighten the dark inset surfaces so they read on cream */
  [data-theme="light"] .daytabs,[data-theme="light"] .prog,[data-theme="light"] .cnode,
  [data-theme="light"] .dcard,[data-theme="light"] .res-stat,[data-theme="light"] .res-chip,
  [data-theme="light"] .pf,[data-theme="light"] .heart,[data-theme="light"] .scard .rm,
  [data-theme="light"] .tailored,[data-theme="light"] .sv-track,[data-theme="light"] #hint{background:rgba(120,92,64,.08)}
  [data-theme="light"] .pill,[data-theme="light"] .tag,[data-theme="light"] .sv-input,
  [data-theme="light"] .sv-chip,[data-theme="light"] .sv-opt,[data-theme="light"] .srow .si,
  [data-theme="light"] .empty .ei{background:rgba(120,92,64,.06)}
  [data-theme="light"] .progtrack,[data-theme="light"] .bar{background:rgba(120,92,64,.14)}
  /* re-color text that the dark theme hard-codes light, so it stays legible on cream */
  [data-theme="light"] .sv-opt,[data-theme="light"] .sv-opt.sel,[data-theme="light"] .sv-chip,
  [data-theme="light"] .tag,[data-theme="light"] .pf,[data-theme="light"] .res-chip,
  [data-theme="light"] .res-name,[data-theme="light"] .res-desc,[data-theme="light"] .sv-build b,
  [data-theme="light"] .why,[data-theme="light"] .why span,[data-theme="light"] .hintro p,
  [data-theme="light"] .hintro b,[data-theme="light"] .hwhy,[data-theme="light"] .tailored .tt,
  [data-theme="light"] .napband b{color:var(--ink)}
  /* deepen the tinted panels a touch so they read as cards on cream */
  [data-theme="light"] .res-card{background:linear-gradient(150deg,rgba(12,139,152,.16),rgba(115,85,196,.13))}
  [data-theme="light"] .profile{background:linear-gradient(135deg,rgba(12,139,152,.14),rgba(115,85,196,.12))}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);
    display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(900px 600px at 85% -10%,rgba(55,214,224,.10),transparent 60%),
               radial-gradient(800px 560px at 5% 110%,rgba(157,126,234,.12),transparent 60%),
               linear-gradient(170deg,var(--bg1),var(--bg0));}
  .display{font-family:"Plus Jakarta Sans","Inter",sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{text-decoration:none;color:inherit}

  /* ---- device shell ---- */
  #device{position:relative;width:100vw;height:100dvh;background:var(--bg0)}
  @media(min-width:600px){
    #device{width:404px;height:min(858px, calc(100dvh - 16px));border-radius:48px;padding:13px;
      background:linear-gradient(160deg,#1b2f4d,#0b1828);
      box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.08);}
    #app{border-radius:36px}
    .notch{display:block}
  }
  #app{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#0b1d35,#091627)}
  .notch{display:none;position:absolute;top:9px;left:50%;transform:translateX(-50%);width:130px;height:28px;background:#05101c;border-radius:16px;z-index:8}

  .statusbar{display:none;justify-content:space-between;align-items:center;padding:14px 24px 4px;font-size:12.5px;font-weight:600;color:#cfe0f2;flex:none;z-index:5}
  @media(min-width:600px){.statusbar{display:flex}}
  .statusbar .ic{display:flex;gap:5px;align-items:center}.statusbar svg{width:16px;height:11px}
  @media(max-width:599px){#app{padding-top:var(--safeT)}}

  #screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
  #screen::-webkit-scrollbar{display:none}
  .view{display:none;padding:6px 16px 26px;animation:fade .35s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pad-tab{padding-bottom:100px}

  /* ---- top app bar ---- */
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 4px;position:sticky;top:0;z-index:4}
  .abL{display:flex;align-items:center;gap:10px}
  .ablogo{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--teal),var(--teal2));display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(55,214,224,.7)}
  .ablogo b{font-family:"Plus Jakarta Sans";font-weight:800;font-size:20px;color:#06131f;letter-spacing:-1.5px;line-height:1}
  .abtitle{font-family:"Plus Jakarta Sans";font-weight:800;font-size:19px;letter-spacing:.3px;color:#fff}
  .absub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .avatar{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 200deg,var(--purple),var(--teal),var(--blue),var(--purple));display:grid;place-items:center;font-weight:700;font-size:12px;color:#07131f;border:2px solid rgba(255,255,255,.18)}
  .ph-title{font-family:"Plus Jakarta Sans";font-weight:800;font-size:26px;letter-spacing:-.6px;margin:10px 2px 2px;color:#fff}
  .ph-sub{font-size:12.5px;color:var(--muted);margin:0 2px 14px}

  /* ---- profile chip ---- */
  .profile{margin:12px 0 6px;border-radius:15px;padding:12px 13px;background:linear-gradient(135deg,rgba(55,214,224,.14),rgba(157,126,234,.13));border:1px solid rgba(55,214,224,.28)}
  .ptop{display:flex;align-items:center;gap:8px;margin-bottom:9px}.ptop .moon{width:17px;height:17px}
  .ptop b{font-family:"Plus Jakarta Sans";font-weight:700;font-size:12.5px}
  .ptop .edit{margin-left:auto;font-size:10.5px;color:var(--teal);font-weight:600;border:1px solid rgba(55,214,224,.4);padding:3px 9px;border-radius:20px;cursor:pointer}
  .pflags{display:flex;flex-wrap:wrap;gap:6px}
  .pf{font-size:10.8px;font-weight:600;padding:4px 9px;border-radius:8px;background:rgba(9,20,35,.5);color:#d6e6f7;display:flex;align-items:center;gap:5px}
  .pf .k{width:6px;height:6px;border-radius:2px}

  /* ---- day tabs + filters ---- */
  .daytabs{display:flex;gap:6px;background:rgba(8,18,32,.6);border:1px solid var(--line);border-radius:13px;padding:4px;margin:14px 0 10px}
  .daytab{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted);font-family:"Plus Jakarta Sans"}
  .daytab.on{background:linear-gradient(150deg,var(--teal),var(--teal2));color:#06131f;box-shadow:0 6px 16px -6px rgba(55,214,224,.6)}
  .filtrow{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.filtrow::-webkit-scrollbar{display:none}
  .pill{flex:none;font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);background:rgba(255,255,255,.025);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .pill .pk{width:7px;height:7px;border-radius:50%}
  .pill.on{color:#06131f;font-weight:700;border-color:transparent}.pill.on .pk{background:#06131f!important;opacity:.55}

  /* ---- day progress (check-off) ---- */
  .prog{border-radius:13px;padding:11px 13px;margin:4px 0 14px;background:rgba(8,18,33,.55);border:1px solid var(--line)}
  .progtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .progtop b{font-family:"Plus Jakarta Sans";font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .progtop b svg{width:15px;height:15px}
  .progtop span{font-size:11px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
  .progtrack{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
  .progfill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .proghint{font-size:10.5px;color:var(--muted2);margin-top:8px;display:flex;align-items:center;gap:5px}.proghint svg{width:12px;height:12px}
  .prog.full{background:linear-gradient(135deg,rgba(52,199,123,.16),rgba(55,214,224,.12));border-color:rgba(52,199,123,.4)}
  .prog.full .progtop b{color:#7ce8b0}

  /* ---- timeline ---- */
  .tl{position:relative;margin-top:2px}
  .stop{position:relative;display:grid;grid-template-columns:54px 1fr;gap:4px}
  .rail{display:flex;flex-direction:column;align-items:center}
  .time{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:7px;text-align:center;line-height:1.2;font-variant-numeric:tabular-nums}
  .cnode{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ac);background:rgba(8,18,32,.4);display:grid;place-items:center;flex:none;z-index:2;transition:.2s;position:relative}
  .cnode svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:.2s}
  .cnode::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ac);opacity:.55;transition:.2s}
  .cnode.on{background:linear-gradient(150deg,var(--teal),var(--green));border-color:var(--green);box-shadow:0 4px 12px -3px rgba(52,199,123,.6)}
  .cnode.on::after{opacity:0}
  .cnode.on svg{opacity:1;transform:scale(1)}
  .line{flex:1;width:2px;min-height:18px;background:linear-gradient(var(--line2),rgba(150,178,210,.06));margin-top:4px}
  .stop:last-child .line{display:none}
  .cwrap{padding-bottom:11px}
  .card{border-radius:16px;padding:13px 13px 12px;position:relative;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    transition:transform .22s,border-color .22s,opacity .25s,filter .25s}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}
  .card:active{transform:scale(.99)}
  .card.match{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
  .card.dim{opacity:.34;filter:saturate(.5)}
  .card.done{opacity:.62;filter:saturate(.7)}
  .card.done .cname{text-decoration:line-through;text-decoration-color:var(--muted2)}
  .donechip{position:absolute;top:11px;right:48px;display:none;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:#7ce8b0;background:rgba(52,199,123,.16);border:1px solid rgba(52,199,123,.4);padding:3px 8px;border-radius:20px}
  .donechip svg{width:10px;height:10px}
  .card.done .donechip{display:flex}
  .ctop{display:flex;gap:11px;align-items:flex-start}
  .tile{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(150deg,var(--ac),var(--ac2));box-shadow:0 7px 16px -8px var(--acsh),inset 0 1px 0 rgba(255,255,255,.35)}
  .tile svg{width:24px;height:24px}
  .cmain{flex:1;min-width:0;padding-right:30px}
  .cname{font-family:"Plus Jakarta Sans";font-weight:700;font-size:15.5px;letter-spacing:-.3px;line-height:1.15}
  .cmeta{font-size:11px;color:var(--muted);margin-top:3px}
  .rate{display:flex;align-items:center;gap:5px;margin-top:6px}.stars{display:flex;gap:1px}.stars svg{width:12px;height:12px}
  .rnum{font-size:11.5px;font-weight:700;color:var(--gold)}.rcount{font-size:10.5px;color:var(--muted2)}
  .gbadge{margin-left:auto;font-size:9px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:3px;opacity:.85}.gbadge svg{width:11px;height:11px}
  .heart{position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(8,18,33,.55);border:1px solid var(--line);z-index:3}
  .heart svg{width:16px;height:16px;transition:.18s}
  .heart.sav svg{fill:#ff5b7f;stroke:#ff5b7f;transform:scale(1.05)}
  /* tailored-to-filter highlight */
  .tailored{margin-top:11px;border-radius:11px;padding:9px 11px;background:rgba(8,18,33,.5);border:1px solid var(--tc);border-left:3px solid var(--tc);display:flex;gap:8px;align-items:flex-start;animation:fade .3s}
  .tailored .tq{width:14px;height:14px;flex:none;margin-top:1px}
  .tailored .tt{font-size:11px;line-height:1.45;color:#dbe8f8}
  .tailored .tt b{color:var(--tc);font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tag{font-size:10.3px;font-weight:600;padding:3px 8px 3px 7px;border-radius:7px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.045);color:#cfe0f3}
  .tag .tk{width:6px;height:6px;border-radius:50%}
  .napband{margin:0 0 11px;border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:9px;background:linear-gradient(100deg,rgba(157,126,234,.18),rgba(74,163,240,.10));border:1px dashed rgba(157,126,234,.5)}
  .napband svg{width:16px;height:16px;flex:none}.napband b{font-family:"Plus Jakarta Sans";font-size:11.5px;font-weight:700;color:#d9ccfb}.napband span{font-size:10.5px;color:var(--muted);margin-left:auto;font-weight:600}
  .hop{display:flex;align-items:center;gap:7px;margin:-4px 0 11px 6px;font-size:10.3px;color:var(--muted2);font-weight:600}.hop svg{width:13px;height:13px;opacity:.8}
  .detail{max-height:0;overflow:hidden;opacity:0;transition:max-height .34s ease,opacity .3s,margin .3s}
  .detail.open{max-height:2400px;opacity:1;margin:-4px 0 12px}
  .dcard{border-radius:14px;padding:13px;background:rgba(8,18,33,.62);border:1px solid var(--line)}
  .why{display:flex;gap:8px;align-items:flex-start;font-size:11.8px;color:#d8e6f6;line-height:1.5;margin-bottom:11px}.why svg{width:15px;height:15px;flex:none;margin-top:1px}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 3px}.barfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),#ffd98a)}
  .dmeta{display:flex;justify-content:space-between;font-size:10.3px;color:var(--muted);margin-bottom:11px}
  .gmaps{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--teal);border:1px solid rgba(55,214,224,.35);padding:7px 12px;border-radius:10px}.gmaps svg{width:14px;height:14px}
  .foot{margin-top:24px;text-align:center;color:var(--muted2);font-size:11px}

  /* ---- hotels (Stay) ---- */
  .hintro{display:flex;gap:9px;border-radius:14px;padding:12px 13px;margin:2px 0 14px;background:linear-gradient(135deg,rgba(55,214,224,.12),rgba(52,199,123,.10));border:1px solid rgba(55,214,224,.25)}
  .hintro svg{width:18px;height:18px;flex:none;margin-top:1px}
  .hintro p{font-size:11.5px;line-height:1.5;color:#d8e6f6}.hintro b{color:#fff;font-weight:700}
  .hotel{border-radius:16px;padding:13px;margin-bottom:12px;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);position:relative;overflow:hidden}
  .hotel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}
  .hbadge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#06131f;background:linear-gradient(150deg,var(--teal),var(--green));padding:3px 9px;border-radius:20px;margin-bottom:9px}
  .hbadge svg{width:11px;height:11px}
  .hname{font-family:"Plus Jakarta Sans";font-weight:700;font-size:15.5px;letter-spacing:-.3px;line-height:1.2}
  .hsub{font-size:11px;color:var(--muted);margin-top:3px}
  .hwhy{font-size:11.5px;color:#d3e2f4;line-height:1.5;margin:10px 0 0}
  .hnote{font-size:10.3px;color:var(--amber);margin-top:7px;display:flex;align-items:center;gap:5px}.hnote svg{width:12px;height:12px;flex:none}
  .hacts{display:flex;gap:8px;margin-top:12px}
  .hbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:700;padding:9px;border-radius:11px}.hbtn svg{width:14px;height:14px}
  .hbtn.map{color:var(--teal);border:1px solid rgba(55,214,224,.35)}
  .hbtn.book{color:#06131f;background:linear-gradient(150deg,var(--teal),var(--teal2));box-shadow:0 7px 16px -8px rgba(55,214,224,.7)}

  /* settings rows + saved + empty */
  .srow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
  .srow .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);flex:none}.srow .si svg{width:18px;height:18px}
  .srow .st{flex:1}.srow .st b{font-size:13.5px;font-weight:600}.srow .st span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .srow .chev{color:var(--muted2);font-size:18px}
  .retake{width:100%;margin-top:18px;font-family:"Plus Jakarta Sans";font-weight:700;font-size:13.5px;color:var(--teal);border:1.5px solid rgba(55,214,224,.4);border-radius:13px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 24px;color:var(--muted)}
  .empty .ei{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:16px}.empty .ei svg{width:30px;height:30px}
  .empty b{font-family:"Plus Jakarta Sans";font-size:15px;color:var(--ink);margin-bottom:6px}.empty span{font-size:12.5px;line-height:1.5;max-width:240px}
  .scard{display:flex;align-items:center;gap:12px;border-radius:14px;padding:11px;margin-bottom:9px;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);position:relative;overflow:hidden}
  .scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}

  /* survey */

  .sv-nav{display:flex;align-items:center;gap:10px;margin-top:22px}
  .sv-back{font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 4px}
  .sv-next{margin-left:auto;font-family:"Plus Jakarta Sans";font-weight:700;font-size:13.5px;color:#06131f;background:linear-gradient(150deg,var(--teal),var(--teal2));border-radius:12px;padding:12px 21px;box-shadow:0 8px 18px -8px rgba(55,214,224,.7);display:flex;align-items:center;gap:7px;transition:transform .14s,opacity .14s}

  .sv-skip{text-align:center;margin-top:16px}.sv-skip span{font-size:11px;color:var(--muted2);border-bottom:1px dashed rgba(150,178,210,.3);padding-bottom:1px}
  .sv-build{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 16px}
  .spinner{width:50px;height:50px;border-radius:50%;border:3px solid rgba(55,214,224,.16);border-top-color:var(--teal);animation:spin .9s linear infinite;margin-bottom:20px}

  .sv-build b{font-family:"Plus Jakarta Sans";font-weight:700;font-size:15px;color:#fff}.sv-build .sub{font-size:12px;color:var(--muted);margin-top:7px;max-width:230px;line-height:1.45}
  .res-badge{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:10px 2px 12px}
  .res-card{border-radius:18px;padding:19px 15px;background:linear-gradient(150deg,rgba(55,214,224,.16),rgba(157,126,234,.14));border:1px solid rgba(55,214,224,.3);text-align:center}
  .res-emoji{width:60px;height:60px;border-radius:17px;margin:0 auto 13px;display:grid;place-items:center;background:linear-gradient(150deg,var(--teal),var(--teal2));box-shadow:0 11px 26px -8px rgba(55,214,224,.6)}.res-emoji svg{width:33px;height:33px}
  .res-name{font-family:"Plus Jakarta Sans";font-weight:800;font-size:20px;letter-spacing:-.5px;line-height:1.15;color:#fff}
  .res-id{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--teal);margin-top:6px}
  .res-desc{font-size:12.3px;color:#dbe8f8;line-height:1.5;margin:11px 4px 0}
  .res-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:15px}
  .res-chip{font-size:10.6px;font-weight:600;padding:5px 10px;border-radius:9px;background:rgba(9,20,35,.5);color:#d6e6f7;display:flex;align-items:center;gap:5px}.res-chip .k{width:6px;height:6px;border-radius:50%}
  .res-stat{display:flex;align-items:center;gap:10px;margin:13px 2px 0;padding:12px 13px;border-radius:13px;background:rgba(8,18,33,.55);border:1px solid var(--line)}.res-stat svg{width:21px;height:21px;flex:none}.res-stat b{font-family:"Plus Jakarta Sans";font-size:12.8px}.res-stat .s{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
  .res-cta{width:100%;margin-top:16px;font-family:"Plus Jakarta Sans";font-weight:700;font-size:14px;color:#06131f;background:linear-gradient(150deg,var(--teal),var(--teal2));border-radius:14px;padding:14px;box-shadow:0 11px 26px -8px rgba(55,214,224,.7);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s}.res-cta:active{transform:scale(.99)}

  /* ---- bottom tab bar ---- */
  #tabbar{display:none;flex:none;background:rgba(8,18,32,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 6px calc(9px + var(--safeB));justify-content:space-around;z-index:6}
  #tabbar.on{display:flex}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);flex:1;padding:3px 0;position:relative}

  .tab.on{color:var(--teal)}.tab.on svg{transform:translateY(-1px)}
  .tab .badge{position:absolute;top:-2px;left:50%;transform:translateX(4px);background:#ff5b7f;color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}

  /* splash */
  #splash{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(700px 500px at 50% 30%,rgba(55,214,224,.16),transparent 60%),linear-gradient(180deg,#0b1d35,#06121f);transition:opacity .55s ease,visibility .55s}
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none}
  .sp-logo{width:90px;height:90px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(150deg,var(--teal),var(--teal2));box-shadow:0 20px 50px -14px rgba(55,214,224,.6),inset 0 1px 0 rgba(255,255,255,.4);animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}
  .sp-logo b{font-family:"Plus Jakarta Sans";font-weight:800;font-size:50px;color:#06131f;letter-spacing:-3px;line-height:1}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
  .sp-name{font-family:"Plus Jakarta Sans";font-weight:800;font-size:28px;letter-spacing:-.5px;margin-top:20px;color:#fff;animation:rise .6s .15s both}
  .sp-tag{font-size:12.5px;color:var(--muted);margin-top:7px;animation:rise .6s .28s both}

  .sp-dots{display:flex;gap:6px;margin-top:30px;animation:rise .6s .4s both}
  .sp-dots span{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:blink 1s infinite}
  .sp-dots span:nth-child(2){animation-delay:.15s}.sp-dots span:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

  #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(8,18,32,.92);border:1px solid var(--line2);border-radius:14px;padding:11px 16px;font-size:12px;color:var(--muted);display:none;align-items:center;gap:10px;z-index:60;max-width:90vw}

  /* ---- segmented control (theme picker) ---- */
  .seg{display:flex;gap:7px;width:100%}
  .segbtn{flex:1;padding:10px 6px;border-radius:11px;border:1.5px solid var(--line2);color:var(--muted);background:transparent;font-weight:700;font-size:12px;font-family:"Plus Jakarta Sans";display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}

  /* ---- account / sign-in ---- */

  .linkbtn{background:none;border:none;color:var(--teal);font-weight:700;font-size:12.5px;padding:6px 2px}

  .savebtn svg{width:15px;height:15px}
  .triprow{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 11px;margin-top:8px;background:rgba(120,140,170,.08);border:1px solid var(--line)}
  .triprow .tt{flex:1;min-width:0}.triprow .tt b{font-size:12.8px;font-family:"Plus Jakarta Sans"}.triprow .tt span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}

  /* ---- reviews ---- */

  /* ---- share sheet ---- */
  .sharebtn-inline{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted2)}

  /* ---- trip groups & discussion ---- */

  .mcount{font-size:11px;color:var(--muted);margin-left:10px}

  .discuss{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
  .msg{display:flex;gap:9px}

  .mbody{flex:1;min-width:0;background:rgba(120,140,170,.08);border:1px solid var(--line);border-radius:13px;padding:9px 11px}
  .mhead{display:flex;align-items:baseline;gap:7px}.mhead b{font-family:"Plus Jakarta Sans";font-size:12.5px}.mhead span{font-size:9.5px;color:var(--muted2)}

async function buildProfile(){

    const data=r.ok?await r.json():null;

function persona(){const young=['b1','b2','b3'].some(k=>svAns.kids.includes(k));
  if(svAns.needs.includes('nap')&&young)return['The Nap-Window Navigators','You move the whole day around the 1:30 nap \u2014 and we love you for it. Stroller-smooth, calm, perfectly paced.','moon'];
  if(svAns.pace==='fast')return['The Go-Go Explorer Crew','Big days, big energy. We\u2019ll pack in the highlights and keep a snack stop never far away.','bolt'];
  if(svAns.pace==='slow')return['The Easy-Does-It Family','No rushing, lots of flex \u2014 room to linger, and a graceful bail-out when little legs give out.','leaf'];
  return['The Balanced Brigade','One big thing, one calm thing, repeat \u2014 a rhythm that keeps kids and grown-ups happy.','star'];}
function computeProfile(){const [name,desc,ic]=persona();

async function loadAuth(){
  try{
    const [meR,prR]=await Promise.all([fetch('/api/me'),fetch('/api/auth/providers')]);
    authState.user=meR.ok?(await meR.json()).user:null;
    authState.providers=prR.ok?(await prR.json()).providers||[]:[];
  }catch(e){authState={user:null,providers:[]};}
}
function signIn(provider){location.href='/api/auth/'+enc(provider)+'/start';}
async function signOut(){try{await fetch('/api/auth/logout',{method:'POST'});}catch(e){}authState.user=null;toast('Signed out');renderProfile();}

async function saveTripToAccount(visibility){
  if(!authState.user){toast('Sign in to save your trip');return null;}
  const body={city:svAns.city,title:(svAns.city?svAns.city+' family trip':'My trip'),survey:svAns,plan:{days:TRIP,hotels:stayHotels},visibility:visibility||'private'};
  try{
    const r=await fetch('/api/trips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){toast('Trip saved to your account ✓');return await r.json();}
    toast(r.status===401?'Please sign in first':'Could not save trip');
  }catch(e){toast('Could not save trip');}
  return null;
}
async function loadMyTripsInto(elm){
  try{const r=await fetch('/api/trips');if(!r.ok)return;const {trips}=await r.json();
    if(!trips.length){elm.innerHTML='';return;}
    elm.innerHTML='<div style="font-size:11px;color:var(--muted);margin:12px 0 6px;font-weight:700">Your saved trips</div>'+trips.map(t=>{
      const d=t.updatedAt?new Date(t.updatedAt).toLocaleDateString():'';
      return `<div class="triprow"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><div class="tt"><b>${esc(t.title||t.city||'Trip')}</b><span>${esc(t.city||'')} · ${esc(d)}</span></div></div>`;
    }).join('');
  }catch(e){}
}
function accountSectionHTML(){
  const u=authState.user;
  if(u){
    const pic=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:esc((u.name||u.email||'?').slice(0,1).toUpperCase());
    return `<div class="acct"><div class="who"><div class="pic">${pic}</div><div style="flex:1;min-width:0"><div class="nm">${esc(u.name||'Signed in')}</div><div class="em">${esc(u.email||u.provider||'')}</div></div><button class="linkbtn" id="signOutBtn">Sign out</button></div>
      <button class="savebtn" id="saveTripBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#06131f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Save this trip to my account</button>

    return `<div class="acct"><div class="authintro"><b>You're using TripIt as a guest.</b> Your trip is saved on this device. Social sign-in isn't set up on this server — everything still works without an account.</div></div>`;

function wireAccount(scope){
  scope.querySelectorAll('.authbtn').forEach(b=>b.onclick=()=>signIn(b.dataset.provider));
  const so=scope.querySelector('#signOutBtn');if(so)so.onclick=signOut;
  const sv=scope.querySelector('#saveTripBtn');if(sv)sv.onclick=()=>saveTripToAccount('private');
  const mt=scope.querySelector('#myTrips');if(mt)loadMyTripsInto(mt);
}

/* ============ REVIEWS ============ */
const venueSubject=name=>({type:'venue',id:`${cityKey(svAns.city)}::${slug(name)}`,city:svAns.city,label:name});
const hotelSubject=name=>({type:'hotel',id:`${cityKey(svAns.city)}::hotel::${slug(name)}`,city:svAns.city,label:name});
const tripSubject=()=>({type:'trip',id:`${cityKey(svAns.city)}::trip`,city:svAns.city,label:(svAns.city||'your')+' family trips'});

function reviewsSectionHTML(ctx){return `<div class="revsec" data-rtype="${ctx.type}" data-rid="${esc(ctx.id)}" data-rcity="${esc(ctx.city||'')}" data-rlabel="${esc(ctx.label||'')}"></div>`;}
function reviewStars(r){let s='';for(let i=1;i<=5;i++)s+=`<svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.1 5.6.8-4 4 1 5.6L12 16l-5 2.6 1-5.6-4-4 5.6-.8z" fill="${r>=i?'var(--gold)':'rgba(150,150,150,.25)'}"/></svg>`;return s;}

async function loadReviews(sec,force){
  if(sec.dataset.loaded&&!force)return;sec.dataset.loaded='1';
  const type=sec.dataset.rtype,id=sec.dataset.rid;
  let data={reviews:[],aggregate:{count:0,avg:null},canModerate:false};
  try{const r=await fetch(`/api/reviews?subjectType=${enc(type)}&subjectId=${enc(id)}`);if(r.ok)data=await r.json();}catch(e){}
  paintReviews(sec,data);
}
function paintReviews(sec,data){
  const label=sec.dataset.rlabel,agg=data.aggregate||{count:0,avg:null};
  const can=!!authState.user;
  const aggHtml=agg.count?`<span class="revagg"><span class="revstars">${reviewStars(Math.round(agg.avg))}</span>${agg.avg.toFixed(1)} · ${agg.count} review${agg.count===1?'':'s'}</span>`:`<span class="revagg">No reviews yet</span>`;
  const list=(data.reviews||[]).map(r=>{
    const dt=r.createdAt?new Date(r.createdAt).toLocaleDateString():'';
    const flagged=r.status&&r.status!=='visible'?` <span style="color:#e0708a;font-size:9.5px">(${esc(r.status)})</span>`:'';
    const consent=r.consentAi?'<span class="consentchip">♥ helping TripIt</span>':'';
    const photo=r.photo?`<img class="rph" src="${esc(r.photo)}" alt="Photo from ${esc(r.author)}">`:'';
    const mod=data.canModerate?`<button data-mod="hide" data-id="${r.id}">Hide</button><button data-mod="remove" data-id="${r.id}" class="danger">Remove</button><button data-mod="restore" data-id="${r.id}">Restore</button>`:'';
    return `<div class="revitem"><div class="revitop"><span class="revstars">${reviewStars(r.rating)}</span><span class="ra">${esc(r.author)}</span>${consent}${flagged}<span class="rd">${esc(dt)}</span></div>${r.title?`<div class="ra" style="margin-bottom:3px">${esc(r.title)}</div>`:''}<div class="rb">${esc(r.body)}</div>${photo}<div class="revfoot"><button data-report="${r.id}">⚐ Report</button>${mod}</div></div>`;
  }).join('')||`<div class="revempty">Be the first family to share how this went.</div>`;
  const writeBtn=can?`<button class="revwrite">＋ Write a review</button>`:`<button class="revwrite" data-needauth="1">Sign in to review</button>`;
  sec.innerHTML=`<div class="revhead"><b>Reviews</b>${aggHtml}${writeBtn}</div><div class="revformwrap"></div><div class="revlist">${list}</div>`;
  wireReviews(sec,data);
}
function reviewFormHTML(){
  return `<div class="revform"><div class="starpick" role="radiogroup" aria-label="Your rating">${[1,2,3,4,5].map(i=>`<button data-star="${i}" aria-label="${i} star${i>1?'s':''}"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.1 5.6.8-4 4 1 5.6L12 16l-5 2.6 1-5.6-4-4 5.6-.8z" fill="rgba(150,150,150,.3)"/></svg></button>`).join('')}</div>
    <input type="text" class="rv-title" placeholder="Title (optional)" maxlength="120">
    <textarea class="rv-body" placeholder="What worked for your family? Strollers, naps, high chairs…" maxlength="2000"></textarea>
    <div class="photopick"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-4-4 3-2-1.5L3 18"/></svg>Add photo<input type="file" accept="image/*" hidden class="rv-photo"></label><img class="photoprev" alt="" style="display:none"></div>
    <label class="consent"><input type="checkbox" class="rv-consent"><span>Use my review to help improve TripIt's recommendations for families like mine. <b>Optional</b>, and you can delete it anytime.</span></label>
    <div class="formerr"></div>
    <div class="revactions"><button class="revsubmit">Post review</button><button class="revcancel">Cancel</button></div></div>`;
}
function wireReviews(sec,data){
  sec.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>doReport(sec,b.dataset.report));
  sec.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>doModerate(sec,b.dataset.id,b.dataset.mod));
  const wb=sec.querySelector('.revwrite');
  if(wb)wb.onclick=()=>{if(wb.dataset.needauth){toast('Open Profile to sign in first');switchTab('profile');return;}openReviewForm(sec);};
}
function openReviewForm(sec){
  const wrap=sec.querySelector('.revformwrap');
  if(wrap.querySelector('.revform')){wrap.innerHTML='';return;}
  wrap.innerHTML=reviewFormHTML();
  let rating=0,photo=null;
  const form=wrap.querySelector('.revform');
  form.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{rating=+b.dataset.star;form.querySelectorAll('[data-star] path').forEach((p,i)=>p.setAttribute('fill',i<rating?'var(--gold)':'rgba(150,150,150,.3)'));});
  const fileInp=form.querySelector('.rv-photo'),prev=form.querySelector('.photoprev');
  fileInp.onchange=async()=>{const f=fileInp.files[0];if(!f)return;try{photo=await downscaleImage(f);prev.src=photo;prev.style.display='block';}catch(e){toast('Could not read that image');}};
  form.querySelector('.revcancel').onclick=()=>{wrap.innerHTML='';};
  form.querySelector('.revsubmit').onclick=async()=>{
    const err=form.querySelector('.formerr');
    const body=form.querySelector('.rv-body').value.trim();
    if(!rating){err.textContent='Please tap a star rating.';return;}
    if(!body){err.textContent='Please add a few words.';return;}
    const payload={subjectType:sec.dataset.rtype,subjectId:sec.dataset.rid,city:sec.dataset.rcity,rating,title:form.querySelector('.rv-title').value.trim(),body,photo,consentAi:form.querySelector('.rv-consent').checked};
    form.querySelector('.revsubmit').disabled=true;
    try{const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d=await r.json();
      if(r.ok){toast('Thanks for sharing ✓');wrap.innerHTML='';loadReviews(sec,true);}
      else{err.textContent=d.error||'Could not post review';form.querySelector('.revsubmit').disabled=false;}
    }catch(e){err.textContent='Could not post review';form.querySelector('.revsubmit').disabled=false;}
  };
}
async function doReport(sec,id){
  if(!confirm('Report this review for our team to check?'))return;
  try{const r=await fetch(`/api/reviews/${enc(id)}/report`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();toast(d.hidden?'Reported — hidden pending review':'Thanks, we’ll take a look');loadReviews(sec,true);}catch(e){toast('Could not report');}
}
async function doModerate(sec,id,action){
  try{const r=await fetch(`/api/reviews/${enc(id)}/moderate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});if(r.ok){toast('Updated');loadReviews(sec,true);}else toast('Not allowed');}catch(e){toast('Failed');}
}
function downscaleImage(file,max=1024,q=0.72){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=url;});}

async function shareTrip(){
  let url=location.origin+'/';
  if(authState.user){const saved=await saveTripToAccount('link');if(saved&&saved.shareToken)url=location.origin+'/?trip='+saved.shareToken;}
  openShareOrNative({title:'Our family trip on TripIt',text:`Our ${svAns.city||'family'} itinerary — nap-friendly and kid-tested, planned with TripIt.`,url});
}
async function openShareOrNative(d){
  if(navigator.share){try{await navigator.share(d);return;}catch(e){if(e&&e.name==='AbortError')return;}}
  openShareSheet(d);
}
function openShareSheet(d){
  const link=d.url,txt=d.text||'',full=enc(txt+' '+link);
  const tile=(k,l,href,onclick)=>`<button class="sharetile" ${href?`data-href="${esc(href)}"`:''} ${onclick?`data-act="${onclick}"`:''}><span class="ic">${SHARE_ICONS[k]}</span>${l}</button>`;
  const tiles=[
    tile('whatsapp','WhatsApp',`https://wa.me/?text=${full}`),
    tile('facebook','Facebook',`https://www.facebook.com/sharer/sharer.php?u=${enc(link)}`),
    tile('x','X',`https://twitter.com/intent/tweet?text=${enc(txt)}&url=${enc(link)}`),
    tile('email','Email',`mailto:?subject=${enc(d.title||'TripIt')}&body=${full}`),
    tile('instagram','Instagram','','copy'),
    tile('tiktok','TikTok','','copy'),
    tile('copy','Copy link','','copy'),
    navigator.share?tile('more','More…','','native'):''
  ].join('');
  el('sheet').innerHTML=`<div class="sheetcard"><h4>Share your trip</h4><p>Post to your socials, or copy the link. For Instagram & TikTok, copy the link and paste it into your post.</p><div class="sharegrid">${tiles}</div><button class="sheetclose">Close</button></div>`;
  const sheet=el('sheet');sheet.classList.add('on');
  sheet.querySelector('.sheetclose').onclick=()=>sheet.classList.remove('on');
  sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on');};
  sheet.querySelectorAll('.sharetile').forEach(t=>t.onclick=async()=>{
    if(t.dataset.act==='native'){sheet.classList.remove('on');try{await navigator.share(d);}catch(e){}return;}
    if(t.dataset.act==='copy'){try{await navigator.clipboard.writeText(link);toast('Link copied ✓');}catch(e){toast(link);}sheet.classList.remove('on');return;}
    if(t.dataset.href){window.open(t.dataset.href,'_blank','noopener');sheet.classList.remove('on');}
  });
}

/* ============ TRIP GROUPS ============ */
let currentGroupId=null, replyTo=null;
const SEND_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="#06131f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-7 16-2-7z"/></svg>';
async function apiGet(u){try{const r=await fetch(u);return r.ok?await r.json():null;}catch(e){return null;}}
const fmtTime=t=>{try{return new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}};
const parseInviteToken=s=>{s=String(s||'').trim();const m=s.match(/[?&]group=([^&]+)/);return m?decodeURIComponent(m[1]):s;};

async function renderGroups(){
  const v=el('groupView');
  if(!authState.user){
    v.innerHTML=`<div class="ph-title">Trip groups</div><div class="ph-sub">Plan together with other families.</div>
      <div class="empty"><div class="ei"><svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 3-5.6 6.5-5.6s6.5 2 6.5 5.6"/><path d="M16 5.3a3 3 0 0 1 0 5.4M17.5 14.6c2.3.5 4 2 4 5.4"/></svg></div><b>Plan together</b><span>Sign in to start a group around your trip, invite other families with a link, and chat in one place.</span><button class="retake" id="grpSignin" style="max-width:220px"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Sign in</button></div>`;
    const b=v.querySelector('#grpSignin');if(b)b.onclick=()=>switchTab('profile');
    return;
  }
  if(currentGroupId)return renderGroupDetail(currentGroupId);
  v.innerHTML=`<div class="ph-title">Trip groups</div><div class="ph-sub">Plan together with other families.</div>
    <div class="grpactions"><button class="savebtn" id="grpCreate"><svg viewBox="0 0 24 24" fill="none" stroke="#06131f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Start a group for this trip</button>
      <div class="joinrow"><input id="grpJoin" placeholder="Paste an invite link or code" aria-label="Invite link or code"><button id="grpJoinBtn">Join</button></div></div>
    <div id="grpList"><div class="revempty">Loading your groups…</div></div>`;
  v.querySelector('#grpCreate').onclick=createGroupForTrip;
  v.querySelector('#grpJoinBtn').onclick=joinGroupFromInput;
  v.querySelector('#grpJoin').onkeydown=e=>{if(e.key==='Enter')joinGroupFromInput();};
  const data=await apiGet('/api/groups');const box=v.querySelector('#grpList');if(!box)return;
  const groups=(data&&data.groups)||[];
  box.innerHTML=groups.length?groups.map(g=>`<div class="grpcard" data-id="${esc(g.id)}" tabindex="0" role="button"><div class="grpic">${esc((g.name||'?').slice(0,1).toUpperCase())}</div><div class="grptt"><b>${esc(g.name)}</b><span>${g.tripCity?esc(g.tripCity)+' · ':''}${g.memberCount} member${g.memberCount===1?'':'s'} · ${esc(g.role)}</span></div><span class="chev">›</span></div>`).join(''):`<div class="revempty">No groups yet. Start one for your trip, or join with an invite link a friend sent you.</div>`;
  box.querySelectorAll('.grpcard').forEach(c=>c.onclick=()=>{currentGroupId=c.dataset.id;renderGroups();});
}
async function createGroupForTrip(){
  if(!authState.user){toast('Sign in first');return switchTab('profile');}
  let tripId=null;
  try{const tr=await fetch('/api/trips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({city:svAns.city,title:(svAns.city?svAns.city+' trip':'My trip'),survey:svAns,plan:{days:TRIP,hotels:stayHotels},visibility:'private'})});if(tr.ok)tripId=(await tr.json()).id;}catch(e){}
  try{const r=await fetch('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:(svAns.city?svAns.city+' families':'Our trip group'),tripId})});
    if(r.ok){currentGroupId=(await r.json()).id;toast('Group created — invite your people ✦');renderGroups();}else toast('Could not create group');
  }catch(e){toast('Could not create group');}
}
function joinGroupFromInput(){const i=el('grpJoin');const t=parseInviteToken(i&&i.value);if(!t){toast('Paste an invite link');return;}joinGroup(t);}
async function joinGroup(token){
  try{const r=await fetch('/api/groups/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    if(r.ok){currentGroupId=(await r.json()).groupId;toast('Joined the group ✓');renderGroups();return true;}
    toast(r.status===401?'Sign in to join':'Invite not found');
  }catch(e){toast('Could not join');}
  return false;
}
async function renderGroupDetail(id){
  const v=el('groupView');
  v.innerHTML=`<div class="grpback" id="grpBack">‹ All groups</div><div class="sv-build" style="padding:40px 16px"><div class="spinner"></div></div>`;
  v.querySelector('#grpBack').onclick=()=>{currentGroupId=null;replyTo=null;renderGroups();};
  const data=await apiGet('/api/groups/'+enc(id));
  if(!data||!data.group){v.innerHTML=`<div class="grpback" id="gb2">‹ All groups</div><div class="revempty">Couldn’t load this group.</div>`;v.querySelector('#gb2').onclick=()=>{currentGroupId=null;renderGroups();};return;}
  const g=data.group;
  const pics=g.members.slice(0,6).map(m=>`<span class="mpic" title="${esc(m.name)}">${m.avatar?`<img src="${esc(m.avatar)}" alt="">`:esc((m.name||'?').slice(0,1).toUpperCase())}</span>`).join('');
  const trip=g.trip?`<div class="grptrip"><div><b>${esc(g.trip.city||'Trip')}</b><span>${(g.trip.plan&&Array.isArray(g.trip.plan.days)?g.trip.plan.days.length:0)}-day plan · shared with the group</span></div><button class="linkbtn" id="grpViewTrip">View trip</button></div>`:'';
  v.innerHTML=`<div class="grpback" id="grpBack">‹ All groups</div>
    <div class="ph-title" style="margin-top:2px">${esc(g.name)}</div>
    <div class="grpmembers">${pics}<span class="mcount">${g.members.length} member${g.members.length===1?'':'s'}</span><button class="revwrite" id="grpInvite" style="margin-left:auto"><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-1px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h6M19 2v6M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM3 21c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg> Invite</button></div>
    ${trip}
    <div class="discuss" id="discuss"><div class="revempty">Loading…</div></div>
    <div class="composer"><input id="msgInput" placeholder="Message your group…" maxlength="2000" aria-label="Message"><button id="msgSend" aria-label="Send message">${SEND_ICON}</button></div>`;
  v.querySelector('#grpBack').onclick=()=>{currentGroupId=null;replyTo=null;renderGroups();};
  v.querySelector('#grpInvite').onclick=()=>inviteToGroup(g);
  if(g.trip){const vt=v.querySelector('#grpViewTrip');if(vt)vt.onclick=()=>viewGroupTrip(g.trip);}
  v.querySelector('#msgSend').onclick=()=>sendGroupMessage(id);
  const mi=v.querySelector('#msgInput');
  mi.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendGroupMessage(id);}else if(e.key==='Escape'){replyTo=null;mi.placeholder='Message your group…';}};
  loadGroupMessages(id);
}
function inviteToGroup(g){const url=location.origin+'/?group='+enc(g.inviteToken);openShareOrNative({title:'Join our TripIt group',text:`Join “${g.name}” on TripIt so we can plan our trip together.`,url});}
function viewGroupTrip(trip){Object.assign(svAns,trip.survey||{});if(trip.city)svAns.city=trip.city;TRIP=(trip.plan&&Array.isArray(trip.plan.days))?trip.plan.days:[];stayHotels=(trip.plan&&Array.isArray(trip.plan.hotels))?trip.plan.hotels:[];activeDay=1;computeProfile();switchTab('plan');toast('Viewing the group’s trip');}
async function loadGroupMessages(id){
  const box=el('discuss');if(!box)return;
  const data=await apiGet('/api/groups/'+enc(id)+'/messages');
  const msgs=(data&&data.messages)||[];
  const top=msgs.filter(m=>!m.parentId), byParent={};
  msgs.filter(m=>m.parentId).forEach(m=>{(byParent[m.parentId]=byParent[m.parentId]||[]).push(m);});
  if(!top.length){box.innerHTML=`<div class="revempty">No messages yet — say hi 👋</div>`;return;}
  box.innerHTML=top.map(m=>msgHTML(m,false)+(byParent[m.id]||[]).map(r=>msgHTML(r,true)).join('')).join('');
  box.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{replyTo=b.dataset.reply;const mi=el('msgInput');if(mi){mi.focus();mi.placeholder='Replying… (Esc to cancel)';}});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteGroupMsg(id,b.dataset.del));
}
function msgHTML(m,reply){
  const pic=m.avatar?`<span class="mpic sm"><img src="${esc(m.avatar)}" alt=""></span>`:`<span class="mpic sm">${esc((m.author||'?').slice(0,1).toUpperCase())}</span>`;
  return `<div class="msg ${reply?'reply':''}">${pic}<div class="mbody"><div class="mhead"><b>${esc(m.author)}</b><span>${esc(fmtTime(m.createdAt))}</span></div><div class="mtext">${esc(m.body)}</div><div class="mfoot">${reply?'':`<button data-reply="${esc(m.id)}">Reply</button>`}${m.canDelete?`<button data-del="${esc(m.id)}" class="danger">Delete</button>`:''}</div></div></div>`;
}
async function sendGroupMessage(id){
  const inp=el('msgInput');if(!inp)return;const body=inp.value.trim();if(!body)return;
  inp.disabled=true;
  try{const r=await fetch('/api/groups/'+enc(id)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,parentId:replyTo})});
    if(r.ok){inp.value='';replyTo=null;inp.placeholder='Message your group…';await loadGroupMessages(id);}
    else{const d=await r.json().catch(()=>({}));toast(d.error||'Could not send');}
  }catch(e){toast('Could not send');}
  inp.disabled=false;inp.focus();
}
async function deleteGroupMsg(id,mid){
  if(!confirm('Delete this message?'))return;
  try{const r=await fetch('/api/groups/'+enc(id)+'/messages/'+enc(mid)+'/delete',{method:'POST'});if(r.ok)loadGroupMessages(id);else toast('Could not delete');}catch(e){toast('Could not delete');}
}

/* ============ NAV / SHELL ============ */
function showView(v){['surveyView','planView','stayView','savedView','groupView','profileView'].forEach(id=>el(id).classList.toggle('on',id===v+'View'));el('screen').scrollTop=0;}
function setTabbar(on){el('tabbar').classList.toggle('on',on);}
function updateBadge(){document.querySelectorAll('#tabbar .tab').forEach(t=>{if(t.dataset.tab==='saved'){let b=t.querySelector('.badge');if(saved.length){if(!b){b=document.createElement('span');b.className='badge';t.appendChild(b);}b.textContent=saved.length;}else if(b)b.remove();}});}
function switchTab(tab){currentTab=tab;document.querySelectorAll('#tabbar .tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  if(tab==='plan'){showView('plan');renderPlan(true);}else if(tab==='stay'){showView('stay');renderStay();}else if(tab==='saved'){showView('saved');renderSaved();}else if(tab==='group'){showView('group');renderGroups();}else{showView('profile');renderProfile();}}
function finishOnboard(){setTabbar(true);switchTab('plan');saveState();}
function openSurvey(){svStep=0;setTabbar(false);showView('survey');renderSurvey();}
document.querySelectorAll('#tabbar .tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));

/* ============ INIT ============ */
async function loadSharedTrip(token){
  try{const r=await fetch('/api/shared/'+enc(token));if(!r.ok)return false;const {trip}=await r.json();if(!trip)return false;
    Object.assign(svAns,trip.survey||{});if(trip.city)svAns.city=trip.city;
    const plan=trip.plan||{};TRIP=Array.isArray(plan.days)?plan.days:[];stayHotels=Array.isArray(plan.hotels)?plan.hotels:[];
    activeDay=1;computeProfile();finishOnboard();toast('Viewing a shared family trip ✦');return true;
  }catch(e){return false;}
}
// keyboard activation for the styled div-buttons (Enter / Space)
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.sv-opt,.sv-chip,.pill,.daytab')){e.preventDefault();e.target.click();}});

const _params=new URLSearchParams(location.search);
const _cleanUrl=()=>{try{history.replaceState({},'',location.pathname);}catch(e){}};
if(_params.get('signedin')){toast('Signed in ✓');_cleanUrl();}
if(_params.get('autherror')){toast('Sign-in didn’t complete — please try again.');_cleanUrl();}
const _grp=_params.get('group');
if(_grp){try{localStorage.setItem('tripit.pendingGroup',_grp);}catch(e){}_cleanUrl();}
loadAuth().then(()=>{
  if(currentTab==='profile'&&el('profileView').classList.contains('on'))renderProfile();
  let pg=null;try{pg=localStorage.getItem('tripit.pendingGroup');}catch(e){}
  if(pg&&el('tabbar').classList.contains('on')){
    if(authState.user){try{localStorage.removeItem('tripit.pendingGroup');}catch(e){}currentGroupId=null;switchTab('group');joinGroup(pg);}
    else{switchTab('group');toast('Sign in to join the group');}
  }
});

const _shared=_params.get('trip');
if(_shared){_cleanUrl();loadSharedTrip(_shared).then(ok=>{if(!ok){if(loadState())finishOnboard();else renderSurvey();}});}
else if(loadState()){finishOnboard();}else{renderSurvey();}
fetch('/api/cities').then(r=>r.json()).then(d=>{if(d&&Array.isArray(d.cities)&&d.cities.length){SEED_CITIES=d.cities;if(el('surveyView').classList.contains('on')&&svStep===0&&!(svAns.city&&String(svAns.city).trim()))renderSurvey();}}).catch(()=>{});
setTimeout(()=>el('splash').classList.add('hide'),1750);
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=el('installBtn');if(b)b.style.display='inline-block';});
el('installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;el('installBtn').style.display='none';}};
</script>
