# Render blueprint — deploys TripIt as a free web service.
#
# Steps:
#   1. Push this repo to GitHub (it already is).
#   2. Go to https://render.com  ->  New  ->  Blueprint  ->  pick this repo.
#   3. (Optional) Paste your ANTHROPIC_API_KEY when prompted to turn on the AI
#      engine. Skip it and TripIt still works on the rules engine.
#   4. Render gives you a public URL like https://tripit.onrender.com.
#      Then run:  npm run qr -- https://tripit.onrender.com
#
# Note: the free plan sleeps after ~15 min idle and wakes on the next visit
# (first hit takes a few seconds). Fine for demos; upgrade for always-on.
services:
  - type: web
    name: tripit
    runtime: node
    plan: free
    branch: claude/ecstatic-cori-im2jpg
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Which AI provider: claude (default) | gemini | auto
      - key: AI_PROVIDER
        value: claude
      # Claude (default) — set the secret in the dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      # Gemini (alternative) — set AI_PROVIDER=gemini to use
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Google Places (live venue data) — optional; seed data used if unset
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # --- Accounts, persistence & social (all optional) ---------------------
      # With none of these set, TripIt runs in guest mode exactly as before.
      #
      # Datastore: the built-in SQLite is used by default, but Render's free web
      # disk is ephemeral (wiped on redeploy). For durable accounts/reviews,
      # add a Render Postgres instance and wire its connection string here:
      #   - key: DATABASE_URL
      #     fromDatabase: { name: tripit-db, property: connectionString }
      - key: DATABASE_URL
        sync: false
      # Signs the OAuth state cookie — generate a long random value.
      - key: SESSION_SECRET
        sync: false
      # Public origin for OAuth redirect URIs, e.g. https://tripit.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # Comma-separated emails allowed to moderate reviews.
      - key: ADMIN_EMAILS
        sync: false
      # Social login — each provider activates when its id + secret are set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
