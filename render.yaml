# Render blueprint — deploys TripIt as a free web service.
#
# Steps:
#   1. Push this repo to GitHub (it already is).
#   2. Go to https://render.com  ->  New  ->  Blueprint  ->  pick this repo.
#   3. (Optional) Paste your ANTHROPIC_API_KEY when prompted to turn on the AI
#      engine. Skip it and TripIt still works on the rules engine.
#   4. Render gives you a public URL like https://tripit.onrender.com.
#      Then run:  npm run qr -- https://tripit.onrender.com
#
# Note: the free plan sleeps after ~15 min idle and wakes on the next visit
# (first hit takes a few seconds). Fine for demos; upgrade for always-on.
services:
  - type: web
    name: tripit
    runtime: node
    plan: free
    branch: claude/ecstatic-cori-im2jpg
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Which AI provider: claude (default) | gemini | auto
      - key: AI_PROVIDER
        value: claude
      # Claude (default) — set the secret in the dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      # Gemini (alternative) — set AI_PROVIDER=gemini to use
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Google Places (live venue data) — optional; seed data used if unset
      - key: GOOGLE_PLACES_API_KEY
        sync: false

      # --- Accounts, persistence & social -----------------------------------
      # Datastore: auto-provisioned Postgres (see the `databases:` block below),
      # wired in automatically here. Without it the app falls back to SQLite,
      # which is wiped on each redeploy on the free web tier.
      - key: DATABASE_URL
        fromDatabase:
          name: tripit-db
          property: connectionString
      # Signs the OAuth state cookie — Render generates a random value for you.
      - key: SESSION_SECRET
        generateValue: true
      # DEMO sign-in for the pitch: makes the Google/Facebook/Apple buttons work
      # as SIMULATED logins (real demo accounts + sessions, so reviews and groups
      # work) with no OAuth setup and no cost. Set to 0 (or remove) for the real
      # product once you've configured real providers below. See docs/DEPLOY.md.
      - key: DEMO_AUTH
        value: "1"
      # DEMO bookings for the pitch: flights, hotels, rides, transit & restaurant
      # reservations are SIMULATED end-to-end (confirmation codes + saved
      # reservations), clearly labeled, with no payment and no provider setup.
      # The deep links (Google Flights/Maps, Uber, OpenTable) are real and free.
      # Set to 0 (and wire the providers below) for real bookings. See docs/PLAN.md.
      - key: DEMO_BOOKINGS
        value: "1"
      # DEMO Apple Wallet: reservations get an in-app Wallet pass + "Add to Apple
      # Wallet" (simulated, labeled demo). Real installable .pkpass passes need an
      # Apple Pass Type ID cert (APPLE_PASS_* below) — approval-gated phase 2.
      - key: DEMO_WALLET
        value: "1"
      # Public origin for OAuth redirect URIs (optional — inferred from the
      # Render URL when unset). Set it for real OAuth, e.g. https://tripit.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # Comma-separated emails allowed to moderate reviews.
      - key: ADMIN_EMAILS
        sync: false
      # Real social login — each provider activates when its id + secret are set,
      # taking over from the demo button automatically.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false

      # --- Real booking providers (approval-gated phase 2; all optional) -----
      # These need partner/business accounts + approval. Until they're set,
      # bookings stay SIMULATED (DEMO_BOOKINGS=1) and the free deep links work.
      # When approved, wire the relevant key(s) and set DEMO_BOOKINGS=0.
      - key: UBER_CLIENT_ID
        sync: false
      - key: UBER_SERVER_TOKEN
        sync: false
      - key: OPENTABLE_PARTNER_KEY
        sync: false
      - key: FLIGHTS_API_KEY
        sync: false
      - key: HOTELS_API_KEY
        sync: false
      # Apple Wallet Pass Type ID cert (real .pkpass signing; phase 2). Set these
      # + the existing APPLE_TEAM_ID + DEMO_WALLET=0 to issue installable passes.
      # Never commit the cert.
      - key: APPLE_PASS_TYPE_ID
        sync: false
      - key: APPLE_PASS_CERT
        sync: false
      - key: APPLE_PASS_KEY
        sync: false

# Auto-provisioned Postgres for accounts/reviews/groups. Render's FREE database
# expires ~30 days after creation — upgrade the plan to keep it beyond that.
databases:
  - name: tripit-db
    plan: free
